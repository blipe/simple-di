name: Final source import

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out verified import payload
        uses: actions/checkout@v4
        with:
          ref: agent/import-simple-di-2.5.0
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct and verify canonical source archive
        run: |
          cat \
            .bootstrap-v3/part-00 \
            .bootstrap-v3/part-01 \
            .bootstrap-v3/part-02 \
            .bootstrap-v3/part-03a \
            .bootstrap-v3/part-03b \
            .bootstrap-v3/part-04 \
            .bootstrap-v3/part-05 \
            .bootstrap-v3/part-06 \
            .bootstrap-v3/part-07 \
            .bootstrap-v3/part-08 \
            .bootstrap-v3/part-09 \
            .bootstrap-v3/part-10 \
            | base64 --decode > /tmp/simple-di-source.tar.xz
          echo '98148210542a66472a107d5f70f2b10a017c056a09ebf91497841833b5848885  /tmp/simple-di-source.tar.xz' | sha256sum --check -
          rm -rf /tmp/simple-di-import
          mkdir -p /tmp/simple-di-import
          tar -xJf /tmp/simple-di-source.tar.xz -C /tmp/simple-di-import
          test "$(find /tmp/simple-di-import -type f | wc -l)" -eq 88

      - name: Replace bootstrap tree with actual source files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/simple-di-import/. .
          chmod +x build.sh test.sh release.sh run-example.sh run-reload-example.sh

      - name: Apply final Maven and JPMS corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pom = Path('pom.xml')
          text = pom.read_text()
          text = text.replace('<version>3.13.0</version>', '<version>3.14.0</version>', 1)
          text = text.replace('<version>3.5.2</version>', '<version>3.5.3</version>', 1)
          pom.write_text(text)

          module = Path('src/main/java/module-info.java')
          text = module.read_text()
          if 'requires static java.compiler;' not in text:
              text = text.replace(
                  '    requires java.xml;\n',
                  '    requires java.xml;\n    requires static java.compiler;\n',
                  1,
              )
          module.write_text(text)
          PY

      - name: Verify Maven Central connectivity
        run: |
          getent ahosts repo.maven.apache.org
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --output /dev/null \
            https://repo.maven.apache.org/maven2/org/apache/maven/plugins/maven-compiler-plugin/3.14.0/maven-compiler-plugin-3.14.0.pom

      - name: Maven verify
        run: mvn --batch-mode --no-transfer-progress --errors clean verify

      - name: Direct verification
        run: |
          ./test.sh
          ./run-example.sh
          ./run-reload-example.sh

      - name: Verify module artifact
        run: |
          jar --describe-module --file target/simple-di-2.5.0.jar
          deps="$(jdeps --print-module-deps target/simple-di-2.5.0.jar)"
          case "$deps" in
            java.base,java.xml|java.base,java.compiler,java.xml) ;;
            *) echo "Unexpected module dependencies: $deps" >&2; exit 1 ;;
          esac

      - name: Commit actual source files to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --soft origin/main
          git add -A
          git commit -m 'Import simple-di 2.5.0 source'
          git push origin HEAD:main
